name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.14t"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # .pre-commit-config.yaml builds hook environments with python3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Build docs
        run: uv run --group dev zensical build --clean --strict

  test-lowest:
    # Runs against the oldest versions pyproject.toml allows, since uv.lock
    # only covers the newest.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Run tests on lowest direct dependencies
        run: uv run --resolution lowest-direct --isolated pytest -v
