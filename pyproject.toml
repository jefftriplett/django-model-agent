[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.5",
  "zensical>=0.0.52",
]

[project]
authors = [
  {name = "Jeff Triplett"}
]
dependencies = [
  "django>=4.2",
  "pydantic>=2.0",
  "pydantic-ai>=2.22"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
description = "A Django Ninja-style abstraction for binding Django models to Pydantic AI Agents"
license = "PolyForm-Noncommercial-1.0.0"
name = "django-model-agent"
readme = "README.md"
requires-python = ">=3.13"
version = "2026.1.1"

[project.urls]
Changelog = "https://github.com/jefftriplett/django-model-agent/releases"
Documentation = "https://django-model-agent.readthedocs.io/en/latest/"
Homepage = "https://github.com/jefftriplett/django-model-agent"
Issues = "https://github.com/jefftriplett/django-model-agent/issues"
Repository = "https://github.com/jefftriplett/django-model-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/django_model_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-v --tb=short"
python_files = ["test_*.py"]
pythonpath = [".", "src"]
testpaths = ["tests"]
